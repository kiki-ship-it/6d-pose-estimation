# 模型配置
model:
  backbone: "resnet50"
  num_keypoints: 8
  freeze_backbone: false
  pretrained: true
  input_size: 640

# 检测器配置
detector:
  model_name: "yolov8m"
  confidence_threshold: 0.5
  nms_threshold: 0.45
  max_det: 100

# 关键点检测器配置
keypoint_detector:
  hidden_dim: 256
  num_layers: 3
  dropout: 0.1

# 训练配置
training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  warmup_epochs: 5
  
  # 损失权重
  loss_weights:
    detection: 1.0
    keypoint: 1.0
    pose: 1.0

# 数据集配置
dataset:
  name: "ycb-video"
  num_classes: 21
  input_size: 640
  augmentation: true
  
  # 数据增强配置
  augmentation_config:
    random_flip: true
    random_rotation: 15
    random_brightness: 0.2
    random_contrast: 0.2
    random_saturation: 0.2
    random_hue: 0.1
    random_scale: [0.8, 1.2]
    random_crop: true

# 推理配置
inference:
  conf_threshold: 0.5
  nms_threshold: 0.45
  device: "cuda"  # "cpu" or "cuda"
  max_batch_size: 32
  
  # PnP求解配置
  pnp_solver: "solvePnP"  # EPNP, ITERATIVE, P3P, etc.
  use_ransac: true
  ransac_iterations: 100

# 评估配置
evaluation:
  metrics: ["add", "adi", "re", "te"]
  add_threshold: 0.1  # 10cm
  adi_threshold: 0.1
  re_threshold: 5.0   # 度
  te_threshold: 0.05  # 5cm

# 日志配置
logging:
  log_dir: "./logs"
  save_interval: 5  # 每5个epoch保存一次
  tensorboard: true
  wandb: false

# 数据加载配置
data_loader:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

# 其他配置
misc:
  seed: 42
  deterministic: true
  benchmark: false
  mixed_precision: false
